services:
  - type: web
    name: mims-backend
    runtime: python
    region: singapore  # Closest to Sri Lanka
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: mysql-btrust.alwaysdata.net
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: btrust_admin
      - key: DB_PASSWORD
        sync: false          # Set this manually in Render dashboard — never commit the real password
      - key: DB_NAME
        value: btrust_group31
      - key: DB_USE_SSL
        value: "false"
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false          # Set this manually in Render dashboard
      - key: BREVO_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: BREVO_SENDER_EMAIL
        sync: false          # Use a sender address verified in Brevo
      - key: BREVO_SENDER_NAME
        value: B-Trust Digital Banking
      - key: SMTP_SERVER
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_LOGIN
        sync: false          # Set this manually in Render dashboard
      - key: SMTP_PASSWORD
        sync: false          # Set this manually in Render dashboard
