services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btrust_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - bank_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: btrust_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bank_network

networks:
  bank_network:
    driver: bridge
